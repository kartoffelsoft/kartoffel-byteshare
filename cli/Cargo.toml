[package]
name = "byteshare-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
byteshare = { path = "../packages/byteshare", features = ["full"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
ratatui = "0.30.2"
ratatui-explorer = "0.3.0"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }
crossterm = "0.29.0"
